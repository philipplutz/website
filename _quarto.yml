project:
  type: website
  output-dir: _site
  resources:
    - fonts/
    - mentions.yml
    - scholar.json
    - skyline.svg
    - figures/
    - citations.json
    - publications.bib
    - datasets.bib
    - llms.txt
    - llms-full.txt
    - robots.txt

website:
  title: "Philipp Lutz"
  description: "Political scientist studying migration and European integration."
  image: prof_pic.jpg
  open-graph: true
  favicon: icon3.png
  site-url: https://philipplutz.org
  page-footer:
    left: "© 2026 Philipp Lutz. Built with [Quarto](https://quarto.org)."
    right: "[Get in touch.](mailto:p.lutz@vu.nl)"
  google-analytics: "G-SWWYN9EBW3"
  navbar:
    pinned: true  
    left:
      - href: index.qmd
        text: About
      - href: publications.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: data.qmd
        text: Data
      - href: teaching.qmd
        text: Teaching
      - href: engagement.qmd
        text: Engagement
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: "mailto:p.lutz@vu.nl"
        aria-label: Email
      - text: "<i class='ai ai-google-scholar' aria-hidden='true'></i><span class='visually-hidden'>Google Scholar</span>"
        href: "https://scholar.google.com/citations?user=Ml32muAAAAAJ"
      - text: "<i class='ai ai-researchgate' aria-hidden='true'></i><span class='visually-hidden'>ResearchGate</span>"
        href: "https://www.researchgate.net/profile/Philipp-Lutz-2"
      - text: "<i class='ai ai-orcid' aria-hidden='true'></i><span class='visually-hidden'>ORCID</span>"
        href: "https://orcid.org/0000-0003-2373-0180"
      - icon: bluesky
        href: "https://bsky.app/profile/lutzphilipp.bsky.social"
        aria-label: Bluesky
      - icon: linkedin
        href: "https://www.linkedin.com/in/philipp-lutz-78254489"
        aria-label: LinkedIn

format:
  html:
    theme:
      light: cosmo
      dark: cyborg
    css: styles.css
    toc: false
    link-external-newwindow: true
    page-layout: article
    grid:
      sidebar-width: 200px
      body-width: 800px
      margin-width: 200px
    include-after-body: pub-icons.html
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css">
