<script>
/* Adds a small icon to every .pub-btn link, chosen by its label.
   New buttons get an icon automatically; unknown labels get a generic one. */
document.addEventListener("DOMContentLoaded", function () {
  var rules = [
    [/^pdf$|accepted version/i,            "bi-file-earmark-pdf"],
    [/^doi$/i,                             "bi-link-45deg"],
    [/supplement|appendix/i,               "bi-paperclip"],
    [/replication|materials/i,             "bi-box-seam"],
    [/pre-?registration/i,                 "bi-clipboard-check"],
    [/blog/i,                              "bi-pencil-square"],
    [/policy brief|dataset article|technical report/i, "bi-file-earmark-text"],
    [/press release/i,                     "bi-megaphone"],
    [/op-?ed|nzz/i,                        "bi-newspaper"],
    [/explorer|dashboard/i,                "bi-bar-chart-line"],
    [/codebook/i,                          "bi-journal-text"],
    [/^data|dataset/i,                     "bi-table"],
    [/analysis/i,                          "bi-graph-up"],
    [/download/i,                          "bi-download"],
    [/video|talk/i,                        "bi-play-circle"],
    [/german version|version/i,            "bi-translate"]
  ];
  document.querySelectorAll("a.pub-btn").forEach(function (a) {
    if (a.querySelector("i.bi")) return;
    var label = a.textContent.trim(), icon = "bi-box-arrow-up-right";
    for (var i = 0; i < rules.length; i++) {
      if (rules[i][0].test(label)) { icon = rules[i][1]; break; }
    }
    var el = document.createElement("i");
    el.className = "bi " + icon;
    el.setAttribute("aria-hidden", "true");
    a.insertBefore(el, a.firstChild);
  });
});
</script>

<script>
/* Research agendas. Publications carry tags such as []{.ag data-ag="trade policy"}.
   On the publications page this adds filter buttons (and reads #agenda=... from the address);
   on the homepage it adds the number of publications to each agenda's "Publications" link. */
(function () {
  var NAMES = { policy: "Migration policies", opinion: "Public opinion and perceptions",
                sharing: "European governance", trade: "Trade agreements" };
  function tagged(root) {
    var out = [];
    root.querySelectorAll("span.ag[data-ag]").forEach(function (s) {
      var el = s.closest("li") || s.closest(".grid");
      if (el) out.push({ el: el, tags: s.getAttribute("data-ag").split(/\s+/), tr: s.hasAttribute("data-tr") });
    });
    return out;
  }
  document.addEventListener("DOMContentLoaded", function () {
    var bar = document.getElementById("agenda-filter");
    if (bar) {
      var content = document.getElementById("quarto-document-content") || document.body;
      var items = tagged(content);
      var taggedEls = items.map(function (i) { return i.el; });
      var heads = [];
      content.querySelectorAll("section.level2 > h2").forEach(function (h) { heads.push({ h: h, text: h.textContent }); });
      function apply(k) {
        if (k !== "all" && !NAMES[k]) k = "all";
        bar.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.dataset.ag === k); });
        var all = k === "all";
        items.forEach(function (i) { i.el.style.display = (all || i.tags.indexOf(k) >= 0) ? "" : "none"; });
        content.querySelectorAll("section li").forEach(function (li) {
          if (taggedEls.indexOf(li) < 0 && !li.closest("details")) li.style.display = all ? "" : "none";
        });
        content.querySelectorAll("section.level3, section.level2").forEach(function (sec) {
          var visible = items.some(function (i) { return sec.contains(i.el) && i.el.style.display !== "none"; });
          sec.style.display = (all || visible) ? "" : "none";
        });
        heads.forEach(function (o) {
          var n = items.filter(function (i) { return o.h.parentNode.contains(i.el) && i.el.style.display !== "none"; }).length;
          var anchor = o.h.querySelector(".anchorjs-link");
          var base = o.text.replace(/\s*\(\d+\)\s*$/, "");
          var hadCount = /\(\d+\)\s*$/.test(o.text);
          var txt = hadCount ? (all ? o.text : base + " (" + n + ")") : o.text;
          o.h.firstChild && o.h.firstChild.nodeType === 3 ? (o.h.firstChild.nodeValue = txt) : null;
          if (anchor) o.h.appendChild(anchor);
        });
      }
      ["all", "policy", "opinion", "sharing", "trade"].forEach(function (k) {
        var b = document.createElement("button");
        b.type = "button"; b.dataset.ag = k; b.textContent = k === "all" ? "All" : NAMES[k];
        b.addEventListener("click", function () {
          history.replaceState(null, "", k === "all" ? location.pathname : "#agenda=" + k);
          apply(k);
        });
        bar.appendChild(b);
      });
      function fromHash() { var m = location.hash.match(/agenda=(\w+)/); apply(m ? m[1] : "all"); }
      window.addEventListener("hashchange", fromHash);
      fromHash();
    }
    var links = document.querySelectorAll("a.agenda-pubs[data-ag]");
    if (links.length) {
      fetch("publications.html").then(function (r) { return r.ok ? r.text() : ""; }).then(function (html) {
        if (!html) return;
        var doc = new DOMParser().parseFromString(html, "text/html");
        var items = tagged(doc);
        links.forEach(function (a) {
          var k = a.dataset.ag;
          var n = items.filter(function (i) { return i.tags.indexOf(k) >= 0 && !i.tr; }).length;
          if (n) a.textContent = "Publications (" + n + ")";
        });
      }).catch(function () {});
    }
  });
})();
</script>

<script>
/* Media and policy mentions, read from mentions.yml (one source for two places):
   - engagement page: fills the lists #mentions-policy (without descriptions, grouped by the body field)
     and #mentions-media;
   - publications page: adds a collapsed "Policy and media uptake" section to every entry
     whose DOI appears in mentions.yml. */
(function () {
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
  var LANG = { de: "German", fr: "French", nl: "Dutch", it: "Italian" };

  function parse(text) {           // the simple list format of mentions.yml
    var rows = [], cur = null;
    text.split(/\r?\n/).forEach(function (line) {
      if (/^\s*(#|$)/.test(line)) return;
      var m = line.match(/^(- |  )([a-z_]+):\s*(.*)$/);
      if (!m) return;
      if (m[1] === "- ") { cur = {}; rows.push(cur); }
      if (!cur) return;
      var v = m[3].trim();
      if (/^".*"$/.test(v)) { try { v = JSON.parse(v); } catch (e) { v = v.slice(1, -1); } }
      else if (/^'.*'$/.test(v)) { v = v.slice(1, -1).replace(/''/g, "'"); }
      cur[m[2]] = v;
    });
    return rows;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function md(s) {                 // [text](url) and *italics* only
    return esc(s).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
                 .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  function when(r) {
    var p = (r.date || "").split("-"), y = p[0], mo = parseInt(p[1], 10);
    if (r.date_precision === "year" || !mo) return y;
    return MONTHS[mo - 1] + " " + y;
  }
  function link(r) {
    var text = r.label ? esc(r.label) : "<em>" + esc(r.title || r.url) + "</em>";
    return '<a href="' + esc(r.url) + '">' + text + "</a>";
  }
  function stop(r) { return /[?!.]$/.test(r.label || r.title || "") ? "" : "."; }
  function lang(r) { return LANG[r.lang] ? " [In " + LANG[r.lang] + "]" : ""; }
  function full(r) {
    return md(r.source) + " (" + when(r) + ") " + link(r) + stop(r) +
           (r.description ? " " + md(r.description) : "") + lang(r);
  }
  function plain(r) { return md(r.source) + " (" + when(r) + ") " + link(r) + stop(r) + lang(r); }
  function short(r) { return md(r.source) + " (" + when(r) + "): " + link(r) + lang(r); }
  function byDate(a, b) { return (b.date || "").localeCompare(a.date || ""); }
  function list(rows, fmt) {
    var ul = document.createElement("ul");
    rows.sort(byDate).forEach(function (r) {
      var li = document.createElement("li"); li.innerHTML = fmt(r); ul.appendChild(li);
    });
    return ul;
  }
  function doiOf(s) { var m = String(s || "").match(/10\.\d{4,9}\/[^\s"<>]+/); return m ? m[0].replace(/[.,;]+$/, "").toLowerCase() : ""; }

  document.addEventListener("DOMContentLoaded", function () {
    var pol = document.getElementById("mentions-policy");
    var med = document.getElementById("mentions-media");
    var pubs = document.getElementById("agenda-filter");   // only on the publications page
    if (!pol && !med && !pubs) return;
    fetch("mentions.yml").then(function (r) { return r.ok ? r.text() : ""; }).then(function (text) {
      var rows = parse(text);
      if (pol) {
        var prows = rows.filter(function (r) {
          return r.section === "policy" && (r.kind === "cited" || r.kind === "commissioned"); });
        var groups = [["public", "Public bodies and international organisations"],
                      ["thinktank", "Think tanks and research institutes"]];
        if (prows.some(function (r) { return r.body; })) {
          groups.forEach(function (g) {
            var sub = prows.filter(function (r) { return (r.body || "thinktank") === g[0]; });
            if (!sub.length) return;
            var h = document.createElement("h3");
            h.className = "mentions-group"; h.textContent = g[1];
            pol.appendChild(h); pol.appendChild(list(sub, plain));
          });
        } else pol.appendChild(list(prows, plain));
      }
      if (med) med.appendChild(list(rows.filter(function (r) { return r.section === "media"; }), full));
      if (pubs) {
        var content = document.getElementById("quarto-document-content") || document.body;
        content.querySelectorAll("section li").forEach(function (li) {
          if (li.closest("details")) return;
          var a = li.querySelector('a[href*="doi.org/10."]');
          var d = a ? doiOf(a.getAttribute("href")) : "";
          if (!d) return;
          var hits = rows.filter(function (r) { return r.doi && r.doi.toLowerCase() === d; });
          if (!hits.length) return;
          var det = document.createElement("details");
          det.className = "uptake";
          det.innerHTML = "<summary>Policy and media uptake (" + hits.length + ")</summary>";
          det.appendChild(list(hits, short));
          li.appendChild(det);
        });
      }
    }).catch(function () {});
  });
})();
</script>
