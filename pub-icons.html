<script>
/* Adds a small icon to every .pub-btn link, chosen by its label.
   New buttons get an icon automatically; unknown labels get a generic one. */
document.addEventListener("DOMContentLoaded", function () {
  var rules = [
    [/^pdf$|accepted version/i,            "bi-file-earmark-pdf"],
    [/^doi$/i,                             "bi-link-45deg"],
    [/supplement|appendix/i,               "bi-paperclip"],
    [/replication|materials/i,             "bi-box-seam"],
    [/pre-?registration/i,                 "bi-clipboard-check"],
    [/blog/i,                              "bi-pencil-square"],
    [/policy brief|dataset article|technical report/i, "bi-file-earmark-text"],
    [/press release/i,                     "bi-megaphone"],
    [/op-?ed|nzz/i,                        "bi-newspaper"],
    [/explorer|dashboard/i,                "bi-bar-chart-line"],
    [/codebook/i,                          "bi-journal-text"],
    [/^data|dataset/i,                     "bi-table"],
    [/analysis/i,                          "bi-graph-up"],
    [/download/i,                          "bi-download"],
    [/video|talk/i,                        "bi-play-circle"],
    [/german version|version/i,            "bi-translate"]
  ];
  document.querySelectorAll("a.pub-btn").forEach(function (a) {
    if (a.querySelector("i.bi")) return;
    var label = a.textContent.trim(), icon = "bi-box-arrow-up-right";
    for (var i = 0; i < rules.length; i++) {
      if (rules[i][0].test(label)) { icon = rules[i][1]; break; }
    }
    var el = document.createElement("i");
    el.className = "bi " + icon;
    el.setAttribute("aria-hidden", "true");
    a.insertBefore(el, a.firstChild);
  });
});
</script>

<script>
/* Research agendas. Publications carry tags such as []{.ag data-ag="trade policy"}.
   On the publications page this adds filter buttons (and reads #agenda=... from the address);
   on the homepage it adds the number of publications to each agenda's "Publications" link. */
(function () {
  var NAMES = { policy: "Migration policies", opinion: "Public opinion and perceptions",
                sharing: "European governance", trade: "Trade agreements" };
  function tagged(root) {
    var out = [];
    root.querySelectorAll("span.ag[data-ag]").forEach(function (s) {
      var el = s.closest("li") || s.closest(".grid");
      if (el) out.push({ el: el, tags: s.getAttribute("data-ag").split(/\s+/), tr: s.hasAttribute("data-tr") });
    });
    return out;
  }
  document.addEventListener("DOMContentLoaded", function () {
    var bar = document.getElementById("agenda-filter");
    if (bar) {
      var content = document.getElementById("quarto-document-content") || document.body;
      var items = tagged(content);
      var taggedEls = items.map(function (i) { return i.el; });
      var heads = [];
      content.querySelectorAll("section.level2 > h2").forEach(function (h) { heads.push({ h: h, text: h.textContent }); });
      function apply(k) {
        if (k !== "all" && !NAMES[k]) k = "all";
        bar.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.dataset.ag === k); });
        var all = k === "all";
        items.forEach(function (i) { i.el.style.display = (all || i.tags.indexOf(k) >= 0) ? "" : "none"; });
        content.querySelectorAll("section li").forEach(function (li) {
          if (taggedEls.indexOf(li) < 0 && !li.closest("details")) li.style.display = all ? "" : "none";
        });
        content.querySelectorAll("section.level3, section.level2").forEach(function (sec) {
          var visible = items.some(function (i) { return sec.contains(i.el) && i.el.style.display !== "none"; });
          sec.style.display = (all || visible) ? "" : "none";
        });
        heads.forEach(function (o) {
          var n = items.filter(function (i) { return o.h.parentNode.contains(i.el) && i.el.style.display !== "none"; }).length;
          var anchor = o.h.querySelector(".anchorjs-link");
          var base = o.text.replace(/\s*\(\d+\)\s*$/, "");
          var hadCount = /\(\d+\)\s*$/.test(o.text);
          var txt = hadCount ? (all ? o.text : base + " (" + n + ")") : o.text;
          o.h.firstChild && o.h.firstChild.nodeType === 3 ? (o.h.firstChild.nodeValue = txt) : null;
          if (anchor) o.h.appendChild(anchor);
        });
      }
      ["all", "policy", "opinion", "sharing", "trade"].forEach(function (k) {
        var b = document.createElement("button");
        b.type = "button"; b.dataset.ag = k; b.textContent = k === "all" ? "All" : NAMES[k];
        b.addEventListener("click", function () {
          history.replaceState(null, "", k === "all" ? location.pathname : "#agenda=" + k);
          apply(k);
        });
        bar.appendChild(b);
      });
      function fromHash() { var m = location.hash.match(/agenda=(\w+)/); apply(m ? m[1] : "all"); }
      window.addEventListener("hashchange", fromHash);
      fromHash();
    }
    var links = document.querySelectorAll("a.agenda-pubs[data-ag]");
    if (links.length) {
      fetch("publications.html").then(function (r) { return r.ok ? r.text() : ""; }).then(function (html) {
        if (!html) return;
        var doc = new DOMParser().parseFromString(html, "text/html");
        var items = tagged(doc);
        links.forEach(function (a) {
          var k = a.dataset.ag;
          var n = items.filter(function (i) { return i.tags.indexOf(k) >= 0 && !i.tr; }).length;
          if (n) a.textContent = "Publications (" + n + ")";
        });
      }).catch(function () {});
    }
  });
})();
</script>

<script>
/* Media and policy mentions, read from mentions.yml (one source for two places):
   - engagement page: fills the lists #mentions-policy (without descriptions, grouped by the body field)
     and #mentions-media;
   - publications page: adds a reception line under each entry with its Google Scholar citation
     count (scholar.json) and its policy and media uptake (mentions.yml, matched by DOI). */
(function () {
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
  var LANG = { de: "German", fr: "French", nl: "Dutch", it: "Italian" };

  function parse(text) {           // the simple list format of mentions.yml
    var rows = [], cur = null;
    text.split(/\r?\n/).forEach(function (line) {
      if (/^\s*(#|$)/.test(line)) return;
      var m = line.match(/^(- |  )([a-z_]+):\s*(.*)$/);
      if (!m) return;
      if (m[1] === "- ") { cur = {}; rows.push(cur); }
      if (!cur) return;
      var v = m[3].trim();
      if (/^".*"$/.test(v)) { try { v = JSON.parse(v); } catch (e) { v = v.slice(1, -1); } }
      else if (/^'.*'$/.test(v)) { v = v.slice(1, -1).replace(/''/g, "'"); }
      cur[m[2]] = v;
    });
    return rows;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function md(s) {                 // [text](url) and *italics* only
    return esc(s).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
                 .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  function when(r) {
    var p = (r.date || "").split("-"), y = p[0], mo = parseInt(p[1], 10);
    if (r.date_precision === "year" || !mo) return y;
    return MONTHS[mo - 1] + " " + y;
  }
  function link(r) {
    var text = r.label ? esc(r.label) : "<em>" + esc(r.title || r.url) + "</em>";
    return '<a href="' + esc(r.url) + '">' + text + "</a>";
  }
  function stop(r) { return /[?!.]$/.test(r.label || r.title || "") ? "" : "."; }
  function lang(r) { return LANG[r.lang] ? " [In " + LANG[r.lang] + "]" : ""; }
  function full(r) {
    return md(r.source) + " (" + when(r) + ") " + link(r) + stop(r) +
           (r.description ? " " + md(r.description) : "") + lang(r);
  }
  function plain(r) { return md(r.source) + " (" + when(r) + ") " + link(r) + stop(r) + lang(r); }
  function short(r) { return md(r.source) + " (" + when(r) + "): " + link(r) + lang(r); }
  function byDate(a, b) { return (b.date || "").localeCompare(a.date || ""); }
  function list(rows, fmt) {
    var ul = document.createElement("ul");
    rows.sort(byDate).forEach(function (r) {
      var li = document.createElement("li"); li.innerHTML = fmt(r); ul.appendChild(li);
    });
    return ul;
  }
  function doiOf(s) { var m = String(s || "").match(/10\.\d{4,9}\/[^\s"<>]+/); return m ? m[0].replace(/[.,;]+$/, "").toLowerCase() : ""; }

  /* Under a publication: a citation chip at the end of the button row (scholar.json, updated monthly)
     and, where there is any, a line with policy uptake and media (mentions.yml). */
  var MIN_CITES = 1;                 // counts below this are not shown
  var CITE_POS = window.CITE_POS || "top";   // where the citation count goes: "top" (right of the title) | "abstract" | "buttons"
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function textKey(s) {
    return String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  }
  function shortName(r) { return r.short || String(r.source || "").replace(/\*/g, "").replace(/\s*\([^)]*\)\s*$/, ""); }
  function docLink(r, label) {
    return '<a href="' + esc(r.url) + '" title="' + esc(r.title || r.label || "") + '">' + label + "</a>";
  }
  function grouped(rows) {           // "SCP 2021, MIDEM 2025, 2026": one link per document
    var order = [], by = {};
    rows.forEach(function (r) { var n = shortName(r); if (!by[n]) { by[n] = []; order.push(n); } by[n].push(r); });
    return order.map(function (n) {
      var g = by[n].slice().sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });
      var years = g.map(function (r) { return (r.date || "").slice(0, 4); });
      var clash = years.some(function (y, i) { return years.indexOf(y) !== i; });
      var dates = g.map(function (r) {
        var p = (r.date || "").split("-"), m = parseInt(p[1], 10);
        return clash && m ? MON[m - 1] + " " + p[0] : p[0];
      });
      if (g.length === 1) return docLink(g[0], esc(n) + " " + dates[0]);
      return esc(n) + " " + g.map(function (r, i) { return docLink(r, dates[i]); }).join(", ");
    }).join(", ");
  }
  function part(icon, html, cls) {
    return '<span class="rc ' + cls + '"><i class="bi ' + icon + '" aria-hidden="true"></i><span>' + html + "</span></span>";
  }
  function reception(li, rows, cites) {
    var a = li.querySelector('a[href*="doi.org/10."]');
    var d = a ? doiOf(a.getAttribute("href")) : "";
    var k = textKey(li.innerText);
    var c = cites.filter(function (x) { return x.doi ? x.doi === d : (x.key && k.indexOf(x.key) >= 0); })[0];
    var details = li.querySelector(":scope > details");
    if (c && c.cites >= MIN_CITES) {   // grey chip at the end of the button row
      var chip = document.createElement("a");
      chip.className = "cite-chip";
      chip.href = c.link;
      chip.title = "Citing works on Google Scholar";
      chip.innerHTML = '<i class="bi bi-quote" aria-hidden="true"></i>' + c.cites + (c.cites === 1 ? " citation" : " citations");
      var sum = details && details.querySelector("summary");
      if (CITE_POS === "top") {      // the count sits in the right margin, positioned against the entry
        chip.classList.add("cite-top"); li.insertBefore(chip, li.firstChild);
        if (getComputedStyle(li).position === "static") li.style.position = "relative";
      }
      else if (CITE_POS === "abstract" && sum) { chip.classList.add("cite-abs"); sum.appendChild(chip); }
      else {
        var btns = li.querySelectorAll(":scope > a.pub-btn"), last = btns[btns.length - 1];
        if (last) last.after(chip); else li.insertBefore(chip, details);
      }
    }
    var hits = !d ? [] : rows.filter(function (r) {    // doi may list several, separated by ";"
      return r.doi && r.doi.toLowerCase().split(/[;,\s]+/).indexOf(d) >= 0; });
    var pol = hits.filter(function (r) { return r.section === "policy"; }).sort(function (x, y) {
      var bx = x.body === "public" ? 0 : 1, by = y.body === "public" ? 0 : 1;
      return bx - by || byDate(x, y); });
    var med = hits.filter(function (r) { return r.section === "media"; }).sort(byDate);
    var parts = [];
    if (pol.length) parts.push(part("bi-bank2", '<span class="rc-label">Policy uptake:</span> ' + grouped(pol), "rc-policy"));
    if (med.length) parts.push(part("bi-newspaper", '<span class="rc-label">Media:</span> ' + grouped(med), "rc-media"));
    if (!parts.length) return;
    var div = document.createElement("div");
    div.className = "reception";
    div.innerHTML = parts.join("");
    li.insertBefore(div, details);
  }
  /* Small bar chart of citations per year for the totals line: one series, no legend;
     bars grow from one baseline, rounded tops, the current (incomplete) year lighter. */
  function yearBars(byYear, updated) {
    if (!byYear || byYear.length < 3) return "";
    var W = 12, GAP = 4, H = 34, R = 3, n = byYear.length, w = n * W + (n - 1) * GAP;
    var max = Math.max.apply(null, byYear.map(function (d) { return d[1]; })) || 1;
    var thisYear = parseInt((updated || "").slice(0, 4), 10);
    var bars = byYear.map(function (d, i) {
      var x = i * (W + GAP), h = Math.max(2, Math.round(d[1] / max * H)), y = H - h, r = Math.min(R, h);
      var partial = d[0] === thisYear;
      var tip = d[0] + (partial ? " (to date)" : "") + ": " + d[1] + " citations";
      return '<g class="yb' + (partial ? " yb-partial" : "") + '"><title>' + tip + "</title>" +
        '<rect class="yb-hit" x="' + (x - GAP / 2) + '" y="0" width="' + (W + GAP) + '" height="' + (H + 14) + '"/>' +
        '<path class="yb-bar" d="M' + x + " " + H + "V" + (y + r) + "Q" + x + " " + y + " " + (x + r) + " " + y +
        "H" + (x + W - r) + "Q" + (x + W) + " " + y + " " + (x + W) + " " + (y + r) + "V" + H + 'Z"/></g>';
    }).join("");
    var label = "Citations per year: " + byYear.map(function (d) { return d[0] + " " + d[1]; }).join(", ");
    return '<svg class="year-bars" width="' + w + '" height="' + (H + 14) + '" viewBox="0 0 ' + w + " " + (H + 14) +
      '" role="img" aria-label="' + label + '">' + bars +
      '<line class="yb-base" x1="0" x2="' + w + '" y1="' + (H + 0.5) + '" y2="' + (H + 0.5) + '"/>' +
      '<text class="yb-year" x="0" y="' + (H + 12) + '">' + byYear[0][0] + "</text>" +
      '<text class="yb-year" x="' + w + '" y="' + (H + 12) + '" text-anchor="end">' + byYear[n - 1][0] + "</text></svg>";
  }
  function get(url) {
    return fetch(url).then(function (r) { return r.ok ? r.text() : ""; }).catch(function () { return ""; });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var pol = document.getElementById("mentions-policy");
    var med = document.getElementById("mentions-media");
    var pubs = document.getElementById("agenda-filter");   // only on the publications page
    if (!pol && !med && !pubs) return;
    Promise.all([get("mentions.yml"), pubs ? get("scholar.json") : ""]).then(function (res) {
      var rows = parse(res[0]), cites = [];
      var sch = {};
      try { sch = JSON.parse(res[1]) || {}; } catch (e) { sch = {}; }
      cites = sch.items || [];
      var box = document.getElementById("scholar-stats"), t = sch.totals || {};
      if (box && t.citations) {      // "954 citations · h-index 14 · Google Scholar, November 2026"
        var u = (sch.updated || "").split("-"), mo = parseInt(u[1], 10);
        box.innerHTML = '<span class="ss"><i class="bi bi-quote" aria-hidden="true"></i><strong>' +
          Number(t.citations).toLocaleString("en-US") + "</strong> citations</span>" +
          (t.h_index ? '<span class="ss">h-index <strong>' + t.h_index + "</strong></span>" : "") +
          (sch.by_year && sch.by_year.length >= 3 ? '<span class="ss ss-chart">' + yearBars(sch.by_year, sch.updated) + "</span>" : "") +
          '<span class="ss ss-src"><a href="' + esc(sch.profile || "") + '">Google Scholar</a>' +
          (mo ? ", " + MONTHS[mo - 1] + " " + u[0] : "") + "</span>";
      }
      if (pol) {
        var prows = rows.filter(function (r) {
          return r.section === "policy" && (r.kind === "cited" || r.kind === "commissioned"); });
        var groups = [["public", "Public bodies and international organisations"],
                      ["thinktank", "Think tanks and research institutes"]];
        if (prows.some(function (r) { return r.body; })) {
          groups.forEach(function (g) {
            var sub = prows.filter(function (r) { return (r.body || "thinktank") === g[0]; });
            if (!sub.length) return;
            var h = document.createElement("h3");
            h.className = "mentions-group"; h.textContent = g[1];
            pol.appendChild(h); pol.appendChild(list(sub, plain));
          });
        } else pol.appendChild(list(prows, plain));
      }
      if (med) med.appendChild(list(rows.filter(function (r) { return r.section === "media"; }), full));
      if (pubs) {
        var content = document.getElementById("quarto-document-content") || document.body;
        content.querySelectorAll("section li").forEach(function (li) {
          if (!li.closest("details")) reception(li, rows, cites);
        });
      }
    }).catch(function () {});
  });
})();
</script>

<script>
/* Figures: clicking a figure opens it large; click, Escape or the close button closes it. */
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a.fig-zoom");
  if (!a) return;
  e.preventDefault();
  var box = document.createElement("div");
  box.className = "fig-lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  var img = a.querySelector("img");
  box.innerHTML = '<button class="fig-close" aria-label="Close">&times;</button><img alt="">';
  box.querySelector("img").src = a.getAttribute("href");
  box.querySelector("img").alt = img ? img.alt : "";
  function close() { box.remove(); document.removeEventListener("keydown", onKey); a.focus(); }
  function onKey(ev) { if (ev.key === "Escape") close(); }
  box.addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box);
  box.querySelector(".fig-close").focus();
});
</script>

<script>
/* Cite: a BibTeX entry for each publication with a DOI, from citations.json
   (Crossref metadata written by _scripts/update_citations.py, refreshed monthly). */
document.addEventListener("DOMContentLoaded", function () {
  var content = document.getElementById("quarto-document-content");
  if (!content || !content.querySelector('li a.pub-btn[href*="doi.org/10."]')) return;
  fetch("citations.json").then(function (r) { return r.ok ? r.json() : {}; }).then(function (cit) {
    var byDoi = {};
    Object.keys(cit).forEach(function (k) { byDoi[k.toLowerCase()] = cit[k]; });
    content.querySelectorAll('li a.pub-btn[href*="doi.org/10."]').forEach(function (a) {
      var doi = decodeURIComponent(a.getAttribute("href").replace(/^https?:\/\/(dx\.)?doi\.org\//, "")).toLowerCase();
      var c = byDoi[doi], li = a.closest("li");
      if (!c || !li || li.querySelector(".cite-btn")) return;
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "pub-btn cite-btn";
      btn.setAttribute("aria-expanded", "false");
      btn.innerHTML = '<i class="bi bi-quote" aria-hidden="true"></i>Cite';
      a.after(document.createTextNode(" · "), btn);
      var box = null;
      btn.addEventListener("click", function () {
        if (box) { box.remove(); box = null; btn.setAttribute("aria-expanded", "false"); return; }
        box = document.createElement("div");
        box.className = "cite-box";
        box.innerHTML = '<pre></pre><div class="cite-actions"><button type="button" class="cite-copy">' +
          '<i class="bi bi-clipboard" aria-hidden="true"></i>Copy BibTeX</button>' +
          '<a href="publications.bib" download><i class="bi bi-download" aria-hidden="true"></i>All publications (.bib)</a></div>';
        box.querySelector("pre").textContent = c.bibtex;
        box.querySelector(".cite-copy").addEventListener("click", function (e) {
          var b = e.currentTarget;
          navigator.clipboard.writeText(c.bibtex).then(function () {
            b.lastChild.textContent = "Copied";
            setTimeout(function () { b.lastChild.textContent = "Copy BibTeX"; }, 1500);
          });
        });
        var det = li.querySelector(":scope > details");
        if (det) li.insertBefore(box, det); else li.appendChild(box);
        btn.setAttribute("aria-expanded", "true");
      });
    });
  }).catch(function () {});
});
</script>
